name: Bug report
description: Report a reproducible issue in a course deliverable or repository tooling.
title: "[bug]: "
labels: ["bug"]
body:
  - type: input
    id: location
    attributes:
      label: Affected path or component
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Environment and verification
      description: Include versions and commands, but no credentials, patient data, or sensitive logs.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data and scope
      options:
        - label: This issue contains no patient data, credentials, or secrets.
          required: true
